name: Launcher unit tests
on:
  pull_request:
    paths: ['ci/**', '.github/workflows/private-source-ci.yml', '.github/workflows/private-ci-launcher-tests.yml']
  push:
    branches: [main]
    paths: ['ci/**', '.github/workflows/private-source-ci.yml', '.github/workflows/private-ci-launcher-tests.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s ci -p 'test_*.py' -v